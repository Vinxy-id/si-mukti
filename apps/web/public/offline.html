<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Luar Jaringan - SI-MUKTI Tulungagung</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0B1C30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.08);
    }
    .badge {
      display: inline-block;
      background-color: #ECFDF5;
      color: #006C49;
      font-weight: 700;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      color: #00236F;
      margin-bottom: 12px;
    }
    p {
      color: #475569;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      width: 100%;
      background-color: #00236F;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 16px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🌐 Mode Luar Jaringan (Offline)</div>
    <h1>Koneksi Seluler Terputus</h1>
    <p>Anda sedang berada di luar jangkauan sinyal internet kawasan tambang marmer. Data pencatatan residu dan paspor terakhir Anda tetap tersimpan aman di memori perangkat.</p>
    <button class="btn" onclick="window.location.reload()">Muat Ulang Halaman</button>
  </div>
</body>
</html>
